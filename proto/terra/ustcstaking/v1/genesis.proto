syntax = "proto3";
package terra.ustcstaking.v1;

import "gogoproto/gogo.proto";
import "terra/ustcstaking/v1/ustcstaking.proto";

option go_package = "github.com/classic-terra/core/v4/x/ustcstaking/types";

message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  repeated Position positions = 2 [(gogoproto.nullable) = false];
  RewardState reward_state = 3 [(gogoproto.nullable) = false];
  uint64 next_position_id = 4 [(gogoproto.moretags) = "yaml:\"next_position_id\""];
}
